[package]
name = "outpeek-app"
version = "0.6.0"
description = "Outpeek native app: tracker window + HUD overlay window in one Slint process"
authors = ["Youssef Adel <contact@reconlab.app>"]
license = "Proprietary"
edition = "2021"
rust-version = "1.85.0"
publish = false

[lib]
name = "outpeek_app"
path = "src/lib.rs"

[[bin]]
name = "outpeek-app"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"

[features]
# Build Slint with element debug info so the embedded MCP server can address
# widgets (get_element_tree / click_element). Off by default: it ships widget
# paths and geometry in the binary, which production does not need.
ui-debug = []

[dependencies]
# The HUD surface, its facts contract and the proven Win32 window recipe.
# One compiled UI, no copies: this crate imports the overlay's tokens through
# build.rs include paths.
outpeek-overlay = { path = "../outpeek-overlay" }
slint = { version = "1.18", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg-wgpu",
    "compat-1-2",
    "raw-window-handle-06",
    # Embedded MCP server (Streamable HTTP) for UI introspection/driving.
    # Inert unless SLINT_MCP_PORT / --mcp-port is set at runtime.
    "mcp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
# Loopback + Riot-remote TLS: native-tls == Schannel on Windows, the same stack
# the Tauri app uses. `accept_invalid_certs` is what the loopback client needs.
native-tls = "0.2"
# Tracker Network only. Its edge refuses the Schannel + HTTP/1.1 fingerprint
# Windows' native-tls sends (403 from the PC, 200 from OpenSSL here and from
# curl.exe there), so this transport uses rustls + HTTP/2 — the combination
# that answers on both hosts.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Included by path: `paths.rs` logs through this crate.
log = "0.4"

[dev-dependencies]
tempfile = "3"
# Test-only: builds the tiny PNG fixtures the cache tests store and decode.
# Same version/features the overlay crate compiles, so this adds no build unit.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# The app window's native HWND, for the DWM corner/frame pass only. Same 0.6
# version Slint's `raw-window-handle-06` feature and the overlay crate use.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
